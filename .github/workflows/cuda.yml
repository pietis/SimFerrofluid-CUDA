name: CUDA bootstrap

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run runtime and Compute Sanitizer checks on the self-hosted NVIDIA runner
        required: true
        default: false
        type: boolean

jobs:
  cuda-compile-only:
    name: CUDA compile-only (no GPU)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install container prerequisites for xmake setup
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl unzip make
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
      - name: Configure standalone CUDA bootstrap
        run: XMAKE_ROOT=y xmake f -c -F cuda/xmake.lua -m release --cuda_backend=y --cuda=/usr/local/cuda
      - name: Compile and link only
        run: |
          XMAKE_ROOT=y xmake build -F cuda/xmake.lua demo_cuda
          XMAKE_ROOT=y xmake build -F cuda/xmake.lua cuda_runtime_tests

  cuda-runtime-nvidia:
    name: CUDA runtime and sanitizer (manual NVIDIA runner)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu == true
    runs-on: [self-hosted, linux, x64, nvidia-gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check self-hosted prerequisites
        run: |
          command -v xmake
          xmake --version
          command -v python3
          python3 --version
      - name: Run host contracts
        run: |
          xmake f -c -F cuda/xmake.lua -m debug
          xmake build -F cuda/xmake.lua cuda_host_tests
          xmake build -F cuda/xmake.lua cuda_cli_host_tests
          xmake build -F cuda/xmake.lua cuda_source_boundary_tests
          xmake run -F cuda/xmake.lua cuda_host_tests
          xmake run -F cuda/xmake.lua cuda_cli_host_tests
          xmake run -F cuda/xmake.lua cuda_source_boundary_tests
      - name: Configure CUDA runtime targets
        run: xmake f -c -F cuda/xmake.lua -m debug --cuda_backend=y --cuda=/usr/local/cuda
      - name: Run CUDA contracts and valid dry run
        run: |
          xmake build -F cuda/xmake.lua demo_cuda
          xmake build -F cuda/xmake.lua cuda_runtime_tests
          xmake run -F cuda/xmake.lua cuda_runtime_tests
          manifest="$(build/linux/x86_64/debug/demo_cuda --test plane --scale 16 --end 1 --rate 500 --cfl .5 --mag=false --dry-run)"
          MANIFEST="$manifest" python3 - <<'PY'
          import json
          import os

          manifest = json.loads(os.environ["MANIFEST"])
          assert manifest["implementation"] == "cuda"
          assert manifest["capability"] == "bootstrap-only"
          assert manifest["advanced_frames"] == 0
          assert manifest["state"] == {
              "time": 0,
              "cell_phi_count": 3072,
              "velocity_counts": [3264, 3328, 3264],
          }
          assert manifest["device"]["synthetic"] is False
          assert manifest["device"]["ordinal"] == 0
          assert manifest["device"]["name"]
          assert manifest["device"]["runtime_version"] > 0
          assert manifest["device"]["driver_version"] > 0
          assert manifest["device"]["compute_capability"][0] > 0
          scene = manifest["scene"]
          assert scene["name"] == "plane"
          assert scene["scale"] == 16
          assert scene["boundary_width"] == 2
          assert scene["cell_grid"]["size"] == [16, 12, 16]
          assert scene["cell_grid"]["spacing"] == 0.01
          assert scene["liquid_surface_y"] == -0.015999999999999993
          assert scene["initial_time"] == 0
          assert scene["initial_velocity"] == [0, 0, 0]
          assert scene["gravity"] == [0, -9.8, 0]
          PY
      - name: Reject unsupported CLI requests
        run: |
          if xmake run -F cuda/xmake.lua demo_cuda -- --test dipole --end 1 --rate 500 --cfl .5 --mag=false --dry-run; then exit 1; fi
          if xmake run -F cuda/xmake.lua demo_cuda -- --test plane --end 1 --rate 500 --cfl .5 --mag=false; then exit 1; fi
      - name: Run Compute Sanitizer
        run: compute-sanitizer --tool memcheck --error-exitcode 1 build/linux/x86_64/debug/cuda_runtime_tests
